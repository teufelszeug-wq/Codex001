name: PRISM forecast history regression
on:
  pull_request:
    paths:
      - 'prism/src/operations/**'
      - 'prism/tests/operations/**'
      - 'prism/data/operations/**'
      - 'prism/scripts/run_forecast_panel.mjs'
      - 'prism/scripts/fetch_nar_racecard.py'
      - 'prism/scripts/jra_forecast_card.py'
      - 'prism/src/prism_pre_day_gate.py'
      - 'prism/tests/test_pre_day_gate.py'
      - 'prism/scripts/engine_full_field_bridge.py'
      - 'prism/scripts/fetch_jra_racecard.py'
      - 'prism/scripts/assemble_official_engine_input.py'
      - 'prism/src/prism_engine/**'
      - '.github/workflows/prism-forecast-history.yml'
  workflow_dispatch:
jobs:
  pre_off_history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PRISM test dependencies
        run: python -m pip install './prism[research]' pytest
      - name: Run PRISM Python regressions
        run: python -m pytest -q prism/tests
      - name: Validate forecast history contract
        run: node --test prism/tests/operations/*.test.mjs prism/tests/foundation/*.test.mjs
