name: PRISM prediction-to-preday regression
on:
  push:
    branches: [prism/independent-forecasts]
    paths:
      - 'prism/**'
      - '.github/workflows/prism-preday-regression.yml'
  workflow_dispatch:
jobs:
  preday-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all PRISM modules and tests
        run: python -m compileall -q prism
      - name: Run full PRISM regression suite (including baseline E2E)
        working-directory: prism
        run: python -m unittest discover -s tests -p 'test_*.py' -v
