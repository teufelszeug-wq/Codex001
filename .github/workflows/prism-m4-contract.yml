name: PRISM M4 contract tests
on:
  push:
    branches:
      - prism/forecast-completion-gate-20261106
  pull_request:
    paths:
      - 'prism/src/prism_ops/**'
      - 'prism/tests/**'
      - '.github/workflows/prism-m4-contract.yml'
  workflow_dispatch:
jobs:
  m4-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: OpenSSL version
        run: openssl version
      - name: Run PRE fail-closed regression suite
        env:
          PYTHONPATH: prism/src
        run: python -m unittest discover -s prism/tests -p 'test_*provenance*.py' -v && python -m unittest discover -s prism/tests -p 'test_m4_tsa_request.py' -v && python -m unittest discover -s prism/tests -p 'test_m4_worm_storage.py' -v && python -m unittest discover -s prism/tests -p 'test_m4_local_snapshot.py' -v && python -m unittest discover -s prism/tests -p 'test_m4_trusted_s3_readback.py' -v && python -m unittest discover -s prism/tests -p 'test_m4_acceptance_s3_integration.py' -v && python -m unittest discover -s prism/tests -p 'test_m4_rfc3161_imprint_parser.py' -v && python -m unittest discover -s prism/tests/ops -p 'test_*.py' -v
