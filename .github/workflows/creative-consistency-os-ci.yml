name: Creative Consistency OS CI

on:
  push:
    paths:
      - "creative-consistency-os/**"
      - ".github/workflows/creative-consistency-os-ci.yml"
  pull_request:
    paths:
      - "creative-consistency-os/**"
      - ".github/workflows/creative-consistency-os-ci.yml"

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creative-consistency-os/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest -q
      - run: alembic upgrade head

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creative-consistency-os/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
