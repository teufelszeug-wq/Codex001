[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-mdisc"
version = "1.1.0"
requires-python = ">=3.10"
description = "PRISM discussion structural audit; not production certification"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
