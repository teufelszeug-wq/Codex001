<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>世界設定案</title><style>body{font:16px/1.8 system-ui,sans-serif;background:#f5f3eb;color:#243c32;max-width:840px;margin:36px auto;padding:0 20px}section{background:white;border-radius:12px;padding:24px;margin:20px 0}label{display:block;margin:16px 0}textarea,input{box-sizing:border-box;width:100%;font:inherit;padding:10px}button{font:inherit;background:#245e49;color:white;border:0;border-radius:6px;padding:10px 16px;margin:8px;cursor:pointer}button:disabled{opacity:.5}a{color:#245e49}pre{white-space:pre-wrap;overflow-wrap:anywhere}#root{overflow-wrap:anywhere}</style><body>
<a href="/">企画・会議の画面へ</a><h1>世界設定案</h1><h2 id="title">読込中</h2><p id="root"></p><p>出典と項目ごとの案を保存します。空欄は未整理のままです。保存しても確定設定や本文には反映されません。</p>
<section><form id="form"><label>出典・今回の指示<input id="source" required maxlength="4000" placeholder="参照資料名や、この案を考えた指示・日時"></label><div id="fields"></div><button id="save" disabled>新しい版として案を保存</button></form><p id="message" role="status"></p></section>
<section><h2>保存した案</h2><button id="refresh" type="button">履歴を更新</button><p id="issues"></p><div id="history"></div></section>
<script>
const $=id=>document.getElementById(id);let context,busy=false,uncertain=false,fieldNames={};
function controls(){ $('save').disabled=!context||busy||uncertain;$('refresh').disabled=busy;document.querySelectorAll('[data-world-council]').forEach(b=>b.disabled=busy||uncertain||b.dataset.stale==='true');}
function councilButton(record){const b=document.createElement('button');b.type='button';b.textContent='この保存版で会議依頼を作成';b.dataset.worldCouncil=record.id;b.dataset.stale=String(record.stale);b.disabled=record.stale||busy||uncertain;b.onclick=()=>startCouncil(record.id);return b;}
async function startCouncil(id){if(busy||uncertain)return;busy=true;controls();try{let r,data;try{r=await fetch('/api/world-council',{method:'POST',headers:{'Content-Type':'application/json','X-Planning-Token':context.token},body:JSON.stringify({operation_id:crypto.randomUUID(),base:context.base,world_plan_id:id})});data=await r.json();}catch{uncertain=true;throw Error('会議の作成結果が不明です。再送せず、企画・会議画面の履歴と操作記録を確認してください。');}if(!r.ok){uncertain=!!data.uncertain;throw Error(data.error);}$('message').textContent='会議依頼を作成しました：'+data.id+'。5担当の回答待ちです。上の「企画・会議の画面へ」から回答と結論を扱えます。入力中の未保存案は含めていません。';}catch(e){$('message').textContent=e.message;}finally{busy=false;controls();}}
async function history(){const r=await fetch('/api/world-plans',{headers:{'X-Planning-Token':context.token}});if(!r.ok)throw Error('履歴を取得できません。');const data=await r.json();fieldNames=data.fields;if(!$('fields').children.length)for(const [key,label]of Object.entries(fieldNames)){const l=document.createElement('label');l.textContent=label;const box=document.createElement('textarea');box.id='field-'+key;box.rows=3;box.maxLength=10000;l.append(box);$('fields').append(l);}
 $('history').replaceChildren();for(const record of data.records){const detail=document.createElement('details'),summary=document.createElement('summary'),text=document.createElement('pre'),button=document.createElement('button');summary.textContent=record.created_at+'・未確定の案'+(record.stale?'・旧基準版':'')+'・'+record.id;text.textContent='出典：'+record.payload.source_ref+'\n'+Object.entries(fieldNames).map(([k,label])=>label+'：'+(record.payload.notes[k]||'未整理')).join('\n');button.textContent='この案を入力欄へ';button.type='button';button.disabled=record.stale;button.onclick=()=>{if(busy||uncertain)return;if(!confirm('現在の未保存入力をこの案で置き換えますか？'))return;$('source').value=record.payload.source_ref;for(const k of Object.keys(fieldNames))$('field-'+k).value=record.payload.notes[k]||'';$('message').textContent='入力欄へ読み込みました。まだ保存していません。';};detail.append(summary,text,button,councilButton(record));$('history').append(detail);}$('issues').textContent=(data.truncated?'表示上限200件です。 ':'')+(data.issues.length?'内容を確認できない記録：'+data.issues.map(x=>x.file).join('、'):'');}
$('refresh').onclick=()=>history().catch(e=>$('issues').textContent=e.message);
$('form').onsubmit=async e=>{e.preventDefault();if(busy||uncertain)return;busy=true;controls();try{const world={series_id:context.series_id,base:context.base,source_ref:$('source').value,notes:Object.fromEntries(Object.keys(fieldNames).map(k=>[k,$('field-'+k).value]))};let r,data;try{r=await fetch('/api/save-world-plan',{method:'POST',headers:{'Content-Type':'application/json','X-Planning-Token':context.token},body:JSON.stringify({operation_id:crypto.randomUUID(),base:context.base,world})});data=await r.json();}catch{uncertain=true;throw Error('保存結果が不明です。再送せず、履歴と企画画面の操作記録を確認してください。');}if(!r.ok){uncertain=!!data.uncertain;throw Error(data.error);}$('message').textContent='未確定の案を保存しました：'+data.id;try{await history();}catch{$('issues').textContent='保存は完了しましたが履歴の更新に失敗しました。';}}catch(e){$('message').textContent=e.message;}finally{busy=false;controls();}};
fetch('/api/init').then(async r=>{if(!r.ok)throw Error();context=await r.json();$('title').textContent=context.title+'（'+context.series_id+'）';$('root').textContent=context.root;await history();controls();}).catch(()=>{$('message').textContent='作品を読み込めません。企画画面から開き直してください。';});
</script></body></html>
