<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>世界設定の項目編集</title><style>body{font:16px/1.8 system-ui,sans-serif;max-width:900px;margin:32px auto;padding:0 20px;background:#f5f3eb;color:#243c32}section{background:white;padding:24px;border-radius:12px;margin:20px 0}label{display:block;margin:12px 0}input,textarea,select{font:inherit;box-sizing:border-box;width:100%;padding:8px}button{font:inherit;padding:10px 16px;margin:8px;background:#245e49;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#245e49}.row{border-top:1px solid #ddd;padding-top:12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:600px){.pair{grid-template-columns:1fr}}</style><body>
<a href="/world">世界設定案へ戻る</a><h1>世界設定の項目編集</h1><p id="title">読込中</p><p>項目IDと出典を明示し、差分を確認して反映候補を作ります。ここでは承認・正本反映は行いません。</p>
<details><summary>現在の設定を確認</summary><pre id="current"></pre></details>
<section><form id="form"><div id="rows"></div><button type="button" id="add" disabled>項目を追加</button><label>検討済みの会議<select id="meeting"><option value="">会議を選択してください</option></select></label><small>一覧には現行の基準版で結論保存まで終えた会議を表示します。</small><label>変更理由<textarea id="reason" rows="2" required></textarea></label><button id="preview" disabled>変更前後を確認</button></form></section>
<section><h2>変更前後</h2><div id="diff">まだ確認していません。</div><button id="stage" disabled>この内容で反映候補を保存</button><p id="message" role="status"></p><p>保存後の承認・反映は既存の一括更新操作で行います。承認画面は準備中です。</p></section>
<script>
const $=id=>document.getElementById(id);let context,categories=[],snapshot=null,digest=null,busy=false,uncertain=false;
function describeEntry(value){const labels={proposal:'提案',confirmed:'確定',rejected:'不採用',unknown:'不明'};return '内容：'+(value.value??'未整理')+'\n状態：'+(labels[value.status]??'要確認')+'\n出典：'+(Array.isArray(value.sources)?value.sources.join('、'):'要確認');}
function controls(){document.querySelectorAll('button').forEach(b=>b.disabled=busy||uncertain||!context);$('stage').disabled=busy||uncertain||!snapshot;}
function invalidate(){snapshot=null;digest=null;$('diff').textContent='入力が変わりました。変更前後を確認してください。';controls();}
function row(){const div=document.createElement('div');div.className='row';const fields=[['category','分類','select'],['id','項目ID（英字で始まる英数字・ハイフン・アンダースコア）','input'],['value','設定内容','textarea'],['status','反映後の状態','select'],['sources','出典（一行につき一つ）','textarea']];for(const [key,label,type]of fields){const l=document.createElement('label');l.textContent=label;const box=document.createElement(type);box.dataset.field=key;box.required=true;if(key==='id'){box.maxLength=80;box.pattern='[a-zA-Z][a-zA-Z0-9_-]{0,79}';}if(type==='textarea'){box.rows=3;box.maxLength=10000;}if(key==='category')for(const c of categories){const o=document.createElement('option');o.value=c.id;o.textContent=c.label;box.append(o);}if(key==='status')for(const [id,name]of [['proposal','提案'],['confirmed','確定'],['rejected','不採用'],['unknown','不明']]){const o=document.createElement('option');o.value=id;o.textContent=name;box.append(o);}l.append(box);div.append(l);}const remove=document.createElement('button');remove.type='button';remove.textContent='入力から取り除く';remove.onclick=()=>{div.remove();invalidate();};div.append(remove);$('rows').append(div);invalidate();}
function input(){return {series_id:context.series_id,base:context.base,meeting_id:$('meeting').value,reason:$('reason').value,entries:[...document.querySelectorAll('.row')].map(r=>{const item=Object.fromEntries([...r.querySelectorAll('[data-field]')].map(x=>[x.dataset.field,x.value]));item.sources=item.sources.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);return item;})};}
async function send(route,payload){let response,data;try{response=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json','X-Planning-Token':context.token},body:JSON.stringify({operation_id:crypto.randomUUID(),base:context.base,...payload})});data=await response.json();}catch{if(route.includes('propose'))uncertain=true;throw Error('通信結果を確認できません。保存中だった場合は再送せず企画画面の操作記録を確認してください。');}if(!response.ok){uncertain=!!data.uncertain;throw Error(data.error);}return data;}
$('add').onclick=row;$('form').oninput=invalidate;
$('form').onsubmit=async e=>{e.preventDefault();if(busy||uncertain)return;const edit=input();busy=true;controls();try{const result=await send('/api/preview-world-entries',{edit});snapshot=edit;digest=result.preview_digest;$('diff').replaceChildren();for(const d of result.diff){const title=document.createElement('h3');title.textContent=(categories.find(c=>c.id===d.category)?.label??d.category)+' / '+d.id;const pair=document.createElement('div');pair.className='pair';for(const [name,value]of [['変更前',d.before],['変更後',d.after]]){const pre=document.createElement('pre');pre.textContent=name+'\n'+(value?describeEntry(value):'未登録');pair.append(pre);}$('diff').append(title,pair);}$('message').textContent='差分を確認しました。まだ保存していません。';}catch(e){$('message').textContent=e.message;}finally{busy=false;controls();}};
$('stage').onclick=async()=>{if(busy||uncertain||!snapshot)return;if(JSON.stringify(input())!==JSON.stringify(snapshot)){invalidate();return;}busy=true;controls();try{const result=await send('/api/propose-world-entries',{edit:snapshot,preview_digest:digest});snapshot=null;$('message').textContent='反映候補を保存しました：'+result.id+'。状態は承認待ちです。正本は変更していません。';}catch(e){$('message').textContent=e.message;}finally{busy=false;controls();}};
(async()=>{const r=await fetch('/api/init');if(!r.ok)throw Error();context=await r.json();const w=await fetch('/api/world-entries',{headers:{'X-Planning-Token':context.token}});if(!w.ok)throw Error();const data=await w.json();categories=data.categories;$('title').textContent=context.title+'（'+context.series_id+'）';$('current').textContent=categories.map(c=>c.label+'\n'+(Array.isArray(data.world[c.id])?data.world[c.id].map(e=>e.id+'\n'+describeEntry(e)).join('\n\n')||'未登録':'形式の確認が必要です')).join('\n\n');for(const m of data.meetings){const o=document.createElement('option');o.value=m.id;o.textContent=m.id+' / '+m.agenda.slice(0,80);$('meeting').append(o);}row();controls();})().catch(()=>{$('message').textContent='作品を読み込めません。画面を開き直してください。';});
</script></body></html>
