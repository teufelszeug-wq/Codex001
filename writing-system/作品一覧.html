<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品一覧｜小説制作</title>
<style>body{font-family:system-ui,sans-serif;background:#f5f3eb;color:#243c32;max-width:820px;margin:40px auto;padding:0 20px;line-height:1.7}section{background:white;padding:24px;margin:24px 0;border-radius:12px}label{display:block;margin-top:16px}input{display:block;box-sizing:border-box;width:100%;padding:12px;font:inherit}button,a{font:inherit}button{padding:10px 18px;background:#245e49;color:white;border:0;border-radius:6px;cursor:pointer;margin:12px 8px 0 0}button:disabled{opacity:.5}small{display:block}#message{white-space:pre-wrap}code{overflow-wrap:anywhere}li{margin:16px 0}a{color:#245e49}</style>
<h1>作品一覧</h1><p>作品ごとの設定と原稿を、専用の保存先で管理します。</p><nav aria-label="共通メニュー"><a href="/progress" target="_blank" rel="noopener">開発進捗を見る ↗</a></nav><p>進捗は開発時に更新する保存版です。更新日と検証範囲を画面で確認できます。</p><p>保存先：<code id="workspace">読込中</code></p>
<section><h2>保存済みの作品</h2><button id="refresh">一覧を更新</button><ul id="series"></ul><p id="issues"></p></section>
<section><h2>新シリーズを作る</h2><form id="create"><label>仮タイトルでも始められます<input id="title" maxlength="200" required></label><label>作品ID（保存フォルダ名）<input id="id" pattern="[a-z][a-z0-9-]*" required placeholder="my-new-series"></label><small>半角英小文字で始め、英小文字・数字・ハイフンを使います。</small><p>作成先：<code id="destination">作品IDを入力してください</code></p><p>空の企画・設定・原稿の領域を作ります。本文は停止状態で開始します。</p><button id="submit" disabled>空のシリーズを作成</button></form></section>
<p id="message" role="status"></p><a id="open" hidden target="_blank" rel="noopener">企画入力を開く</a>
<script>
const $=id=>document.getElementById(id);let context,busy=false;
function preview(){$('destination').textContent=context&&$('id').value?context.workspace+'/'+$('id').value:'作品IDを入力してください';}
async function refresh(){const r=await fetch('/api/init');if(!r.ok)throw Error('一覧を読み込めませんでした。');context=await r.json();$('workspace').textContent=context.workspace;$('series').replaceChildren();for(const item of context.series){const li=document.createElement('li'),text=document.createElement('span'),button=document.createElement('button');text.textContent=item.title+'（'+item.id+'）';button.textContent='企画入力へ';button.onclick=()=>action(()=>openSeries(item.id));li.append(text,button);$('series').append(li);}$('issues').textContent=context.issues.length?'要確認の保存先：'+context.issues.join('、'):context.series.length?'':'保存済みの作品はありません。';$('submit').disabled=false;preview();}
async function send(route,input){const r=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json','X-Workspace-Token':context.token},body:JSON.stringify(input)});const data=await r.json();if(!r.ok)throw Error(data.error);return data;}
async function openSeries(id){const data=await send('/api/open',{id});$('open').href=data.url;$('open').hidden=false;$('message').textContent=id+' の企画入力を準備しました。下のリンクから開けます。';}
async function action(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(x=>x.disabled=true);$('open').hidden=true;try{await fn();}catch(e){$('message').textContent=e.message+'\n通信中に失敗した場合は一覧を更新して保存先を確認してください。';}finally{busy=false;document.querySelectorAll('button').forEach(x=>x.disabled=!context);}}
$('id').oninput=preview;$('refresh').onclick=()=>action(refresh);$('create').onsubmit=e=>{e.preventDefault();action(async()=>{const data=await send('/api/create',{id:$('id').value,title:$('title').value});$('message').textContent='作成しました：'+data.root;await refresh();await openSeries(data.id);});};action(refresh);
</script></html>
