<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本文レビュー会議</title>
<style>body{font-family:system-ui,'Yu Gothic',sans-serif;margin:0;background:#f4f5f0;color:#22352f}main{max-width:900px;margin:40px auto;padding:0 24px}section{background:white;border:1px solid #dce1d8;border-radius:14px;padding:24px;margin:20px 0}label{display:block;margin:16px 0 8px}select,textarea,button{font:inherit;padding:12px;border:1px solid #bbc9bf;border-radius:8px}select,textarea{width:100%;box-sizing:border-box}textarea{min-height:110px}button{background:#23533d;color:white;cursor:pointer;margin-top:16px}button:disabled{opacity:.45;cursor:default}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;font:inherit;max-height:65vh;overflow:auto}p{line-height:1.8}a{color:#206851}#message{white-space:pre-wrap;color:#914723}#meta{overflow-wrap:anywhere;font-size:13px}</style>
<main><a href="/">企画・会議履歴へ戻る</a><h1>本文を読んで会議を作る</h1><p id="title">作品を読み込み中…</p><p>既存本文への指摘と改善案を検討します。ここでは本文を書き換えません。</p>
<section><label for="scene">読む原稿</label><select id="scene" disabled></select><button id="read" disabled>この原稿を読む</button><p id="meta"></p><pre id="body"></pre></section>
<section><label for="agenda">検討したいこと</label><textarea id="agenda" placeholder="人物の気持ち、会話の自然さ、設定との整合など"></textarea><label for="workflow">進め方の希望</label><select id="workflow"><option value="conversation">会話で検討する</option><option value="hybrid">案と会話を組み合わせる</option><option value="generated_then_review">案を受け取って検討する</option></select><p>三人の知性・作家視点の編集レビュー・整合性担当・主人公役へ依頼します。主人公役には登録知識のみを渡し、本文全文や作者の議題は共有しません。進め方の選択だけでは外部AIを実行しません。</p><label><input id="confirmed" type="checkbox">表示した原稿を会議の対象として確認しました</label><button id="create" disabled>レビュー会議の依頼を保存</button></section><p id="message" role="status"></p><p>保存結果が不明な場合は再送せず、会議履歴と操作記録を確認してください。</p></main>
<script>
const $=id=>document.getElementById(id);let context=null,source=null,busy=false,uncertain=false;
function controls(){for(const id of ['agenda','workflow','confirmed'])$(id).disabled=busy||uncertain;$('scene').disabled=busy||!context;$('read').disabled=busy||!context||!$('scene').value;$('create').disabled=busy||uncertain||!source||!$('confirmed').checked||!$('agenda').value.trim();}
function invalidate(){source=null;$('confirmed').checked=false;$('body').textContent='';$('meta').textContent='';controls();}
$('scene').onchange=invalidate;$('confirmed').onchange=controls;$('agenda').oninput=controls;
async function json(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json','X-Planning-Token':context?.token??'',...options.headers}});const d=await r.json();if(!r.ok){const e=Error(d.error??'読込に失敗しました。');e.uncertain=!!d.uncertain;e.known=true;throw e;}return d;}
function post(url,data){return json(url,{method:'POST',body:JSON.stringify(data)});}
$('read').onclick=async()=>{if(busy)return;invalidate();busy=true;controls();try{source=await post('/api/read-manuscript',{series_id:context.series_id,base:context.base,scene_id:$('scene').value});$('body').textContent=source.text;$('meta').textContent=source.scene_id+' / '+source.status+' / '+source.path+' / SHA256: '+source.sha256;$('message').textContent='本文を読み込みました。会議はまだ作成していません。';}catch(e){$('message').textContent=e.message+' 作品が更新された場合は画面を開き直してください。';}finally{busy=false;controls();}};
$('create').onclick=async()=>{if(busy||uncertain||!source||!$('confirmed').checked||!$('agenda').value.trim())return;busy=true;controls();const input={operation_id:crypto.randomUUID(),base:source.base,confirmed:true,review:{series_id:source.series_id,base:source.base,scene_id:source.scene_id,manuscript_sha256:source.sha256,agenda:$('agenda').value,workflow:$('workflow').value}};try{const r=await post('/api/manuscript-council',input);source=null;$('confirmed').checked=false;$('message').textContent='会議依頼を保存しました：'+r.id+'\n回答待ちです。企画・会議履歴から回答と結論を入力できます。';}catch(e){if(!e.known||e.uncertain){uncertain=true;$('message').textContent='保存結果が不明です。再送せず会議履歴と操作記録を照合してください。';}else $('message').textContent=e.message;}finally{busy=false;controls();}};
(async()=>{try{context=await json('/api/init');const list=await json('/api/manuscripts');if(list.series_id!==context.series_id||list.base!==context.base)throw Error('作品が更新されています。画面を開き直してください。');$('title').textContent=context.title+(list.paused?'・本文変更は停止中':'');for(const s of list.scenes){const o=document.createElement('option');o.value=s.id;o.textContent=s.id+' / '+s.status+' / '+s.path;$('scene').append(o);}if(!list.scenes.length)$('message').textContent='登録された原稿はまだありません。';controls();}catch(e){context=null;$('title').textContent='作品を読み込めません';$('message').textContent=e.message;controls();}})();
</script></html>
