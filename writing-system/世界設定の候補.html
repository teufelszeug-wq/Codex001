<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>世界設定の保存済み候補</title><style>body{font:16px/1.8 system-ui,sans-serif;max-width:1000px;margin:32px auto;padding:0 20px;background:#f5f3eb;color:#243c32}details{background:white;padding:20px;border-radius:12px;margin:20px 0}summary{cursor:pointer;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{font:inherit;padding:10px 16px;background:#245e49;color:white;border:0;border-radius:6px}a{color:#245e49}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:600px){.pair{grid-template-columns:1fr}}</style><body><a href="/world-entries">項目入力へ</a> ／ <a href="/">企画・会議へ</a><h1>世界設定の保存済み候補</h1><p id="title">読込中</p><p>保存した変更前後と承認・反映の記録を読み戻します。この画面は閲覧専用です。</p><button id="refresh" disabled>最新の記録を読む</button><p id="message" role="status"></p><div id="records"></div><p id="issues"></p>
<script>
const $=id=>document.getElementById(id);let context;
const labels={proposed:'承認待ち',approved:'承認済み・未反映',applying:'反映中・要確認',applied:'反映済み',rolling_back:'取消中・要確認',rolled_back:'取消済み'};
const categories={countries:'国・地域',languages:'言語・命名',writing_systems:'文字体系',units:'単位・暦',currencies:'通貨・取引',religions:'宗教・信仰',magic_rules:'魔法・科学的仮定と制約',institutions:'制度・暮らし'};
function describe(v){return v?'内容：'+v.value+'\n状態：'+({proposal:'提案',confirmed:'確定',rejected:'不採用',unknown:'不明'}[v.status]??'要確認')+'\n出典：'+(v.sources??[]).join('、'):'未登録';}
async function refresh(){if(!context)return;$('refresh').disabled=true;try{const response=await fetch('/api/world-candidates',{headers:{'X-Planning-Token':context.token}});const data=await response.json();if(!response.ok)throw Error(data.error);$('records').replaceChildren();for(const r of data.records){const detail=document.createElement('details'),summary=document.createElement('summary'),meta=document.createElement('pre');summary.textContent=labels[r.status]+' ／ '+r.id;meta.textContent='変更理由：'+r.reason+'\n会議：'+r.meeting_id+'\n現在の正本：'+(r.current_matches_after?'変更後の内容と一致':r.current_matches_before?'変更前の内容と一致':'変更前後のどちらとも異なります')+'\n基準版：'+(r.stale?'現在とは異なります（反映後は通常変わります）':'現在と一致')+(r.approval?'\n承認者：'+r.approval.actor+'\n承認根拠：'+r.approval.source:'')+(r.rollback?'\n取消者：'+r.rollback.actor+'\n取消根拠：'+r.rollback.source:'');detail.append(summary,meta);for(const d of r.diff){const heading=document.createElement('h3');heading.textContent=(categories[d.category]??d.category)+' ／ '+d.id;const pair=document.createElement('div');pair.className='pair';for(const [name,v]of [['変更前',d.before],['変更後',d.after]]){const p=document.createElement('pre');p.textContent=name+'\n'+describe(v);pair.append(p);}detail.append(heading,pair);}$('records').append(detail);}$('message').textContent=data.records.length+'件の候補を読み込みました。承認・反映・取消は行っていません。';$('issues').textContent=(data.truncated?'200件までの表示です。 ':'')+data.issues.map(x=>x.id+'：'+x.message).join('\n');}catch(e){$('records').replaceChildren();$('message').textContent=e.message;}finally{$('refresh').disabled=false;}}
$('refresh').onclick=refresh;(async()=>{const response=await fetch('/api/init'),data=await response.json();if(!response.ok)throw Error(data.error);context=data;$('title').textContent=data.title+'（'+data.series_id+'）';await refresh();})().catch(e=>$('message').textContent=e.message);
</script></body></html>
