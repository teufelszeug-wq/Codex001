<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>世界設定の保存済み候補</title><style>body{font:16px/1.8 system-ui,sans-serif;max-width:1000px;margin:32px auto;padding:0 20px;background:#f5f3eb;color:#243c32}details{background:white;padding:20px;border-radius:12px;margin:20px 0}summary{cursor:pointer;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin:12px 0}input,textarea{display:block;box-sizing:border-box;width:100%;padding:8px;font:inherit}button:disabled{opacity:.5}button{font:inherit;padding:10px 16px;background:#245e49;color:white;border:0;border-radius:6px}a{color:#245e49}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:600px){.pair{grid-template-columns:1fr}}</style><body><a href="/world-entries">項目入力へ</a> ／ <a href="/">企画・会議へ</a><h1>世界設定の保存済み候補</h1><p id="title">読込中</p><p>保存した変更前後と承認・反映の記録を読み戻します。内容を確認し、承認・反映・取消を個別に操作できます。</p><button id="refresh" disabled>最新の記録を読む</button><p id="message" role="status"></p><div id="records"></div><p id="issues"></p>
<script>
const $=id=>document.getElementById(id);let context,busy=false,uncertain=false;
const labels={proposed:'承認待ち',approved:'承認済み・未反映',applying:'反映中・要確認',applied:'反映済み',rolling_back:'取消中・要確認',rolled_back:'取消済み'};
const categories={countries:'国・地域',languages:'言語・命名',writing_systems:'文字体系',units:'単位・暦',currencies:'通貨・取引',religions:'宗教・信仰',magic_rules:'魔法・科学的仮定と制約',institutions:'制度・暮らし'};
function describe(v){return v?'内容：'+v.value+'\n状態：'+({proposal:'提案',confirmed:'確定',rejected:'不採用',unknown:'不明'}[v.status]??'要確認')+'\n出典：'+(v.sources??[]).join('、'):'未登録';}
function controls(){document.querySelectorAll('[data-action]').forEach(b=>b.disabled=busy||uncertain||b.dataset.enabled!=='true');$('refresh').disabled=busy;}
function actions(r,detail){const kind=r.status==='proposed'?'approve':r.status==='approved'?'apply':r.status==='applied'?'rollback':null;if(!kind)return;const box=document.createElement('div'),actor=document.createElement('input'),source=document.createElement('textarea');if(kind!=='apply'){const a=document.createElement('label'),s=document.createElement('label');a.textContent=kind==='approve'?'承認する方の名前':'取り消す方の名前';s.textContent=kind==='approve'?'承認の根拠・指示':'取消の根拠・理由';a.append(actor);s.append(source);box.append(a,s);}const b=document.createElement('button');b.dataset.action=kind;b.dataset.enabled=String(kind==='rollback'?r.current_matches_after:!r.stale&&r.current_matches_before);b.textContent={approve:'この候補を承認する',apply:'承認済みの変更を正本へ反映する',rollback:'この変更を取り消して元に戻す'}[kind];b.onclick=()=>perform(r,kind,actor.value,source.value);box.append(b);detail.append(box);}
async function perform(r,action,actor,source){if(busy||uncertain)return;if(action!=='apply'&&(!actor.trim()||!source.trim())){$('message').textContent='名前と根拠を入力してください。';return;}if(!confirm(({approve:'表示した候補を承認します。まだ正本は変更しません。',apply:'表示した候補を正本へ反映します。',rollback:'この候補による変更を取り消します。後の変更がある場合は停止します。'}[action])+'\n候補：'+r.id))return;busy=true;controls();try{let response,data;try{response=await fetch('/api/world-candidate-action',{method:'POST',headers:{'Content-Type':'application/json','X-Planning-Token':context.token},body:JSON.stringify({series_id:context.series_id,id:r.id,digest:r.digest,action,actor,source,confirmed:true})});data=await response.json();}catch{uncertain=true;throw Error('処理結果が不明です。再送せず、最新の記録を読み直してください。');}if(!response.ok){uncertain=!!data.uncertain;throw Error(data.error);}busy=false;await refresh();}catch(e){$('message').textContent=e.message;}finally{busy=false;controls();}}
async function refresh(){if(!context||busy)return;busy=true;controls();try{const response=await fetch('/api/world-candidates',{headers:{'X-Planning-Token':context.token}});const data=await response.json();if(!response.ok)throw Error(data.error);uncertain=false;$('records').replaceChildren();for(const r of data.records){const detail=document.createElement('details'),summary=document.createElement('summary'),meta=document.createElement('pre');summary.textContent=labels[r.status]+' ／ '+r.id;meta.textContent='変更理由：'+r.reason+'\n会議：'+r.meeting_id+'\n現在の正本：'+(r.current_matches_after?'変更後の内容と一致':r.current_matches_before?'変更前の内容と一致':'変更前後のどちらとも異なります')+'\n基準版：'+(r.stale?'現在とは異なります（反映後は通常変わります）':'現在と一致')+(r.approval?'\n承認者：'+r.approval.actor+'\n承認根拠：'+r.approval.source:'')+(r.rollback?'\n取消者：'+r.rollback.actor+'\n取消根拠：'+r.rollback.source:'');detail.append(summary,meta);for(const d of r.diff){const heading=document.createElement('h3');heading.textContent=(categories[d.category]??d.category)+' ／ '+d.id;const pair=document.createElement('div');pair.className='pair';for(const [name,v]of [['変更前',d.before],['変更後',d.after]]){const p=document.createElement('pre');p.textContent=name+'\n'+describe(v);pair.append(p);}detail.append(heading,pair);}actions(r,detail);$('records').append(detail);}$('message').textContent=data.records.length+'件の候補を読み込みました。各操作は候補の詳細内で行えます。';$('issues').textContent=(data.truncated?'200件までの表示です。 ':'')+data.issues.map(x=>x.id+'：'+x.message).join('\n');}catch(e){$('records').replaceChildren();$('message').textContent=e.message;}finally{busy=false;controls();}}
$('refresh').onclick=refresh;(async()=>{const response=await fetch('/api/init'),data=await response.json();if(!response.ok)throw Error(data.error);context=data;$('title').textContent=data.title+'（'+data.series_id+'）';await refresh();})().catch(e=>$('message').textContent=e.message);
</script></body></html>
